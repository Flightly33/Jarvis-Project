name: Windows build

on:
  push:
    branches: ["claude/gifted-bohr-hvwy4i", "main"]
  workflow_dispatch:

permissions:
  contents: write

# Only one build publishes the installer at a time; a newer push replaces a build still in progress.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[claude,voice,dev]" pyinstaller
      - name: Speech model cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\models
          key: speech-models-${{ hashFiles('src/jarvis/voice/models.py', 'src/jarvis/config.py') }}
      - name: Windows tests (including the real speech engines)
        env:
          JARVIS_TEST_MODELS: ${{ runner.temp }}\models
        run: python -m pytest tests/test_windows.py tests/test_voice.py tests/test_server.py -q
      - name: Build application
        run: >
          pyinstaller --noconfirm --clean --name Jarvis --console
          --collect-all claude_agent_sdk --collect-all sherpa_onnx --collect-all piper --collect-all sentencepiece
          --collect-all sounddevice --collect-all _sounddevice_data --collect-all onnxruntime
          --collect-submodules jarvis --collect-submodules uvicorn
          --add-data "src/jarvis/server/static;jarvis/server/static"
          packaging/jarvis_entry.py
      - name: Self-test the built program
        env:
          JARVIS_MODELS_DIR: ${{ runner.temp }}\models
        run: |
          dist\Jarvis\Jarvis.exe --version
          dist\Jarvis\Jarvis.exe selftest --require-voice
      - name: Zip
        run: Compress-Archive -Path dist\Jarvis -DestinationPath dist\Jarvis-windows.zip
      - name: Build installer
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q packaging\jarvis.iss
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files="dist/Jarvis-windows.zip"
          [ -f dist/JarvisSetup.exe ] && files="dist/JarvisSetup.exe $files"
          title="Jarvis for Windows (preview)"
          notes="Automatic preview build. Download JarvisSetup.exe and run it, or unzip Jarvis-windows.zip and run Jarvis.exe. Windows may warn that the app is unrecognised because it is not code-signed: choose More info, then Run anyway."
          # Replace the files on the existing release rather than deleting and recreating it,
          # so the download page is never left empty if a step fails.
          publish() {
            if gh release view windows-preview >/dev/null 2>&1; then
              gh release upload windows-preview $files --clobber &&
              gh release edit windows-preview --title "$title" --notes "$notes" --prerelease
            else
              gh release create windows-preview $files --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes"
            fi
          }
          for attempt in 1 2 3; do
            if publish; then exit 0; fi
            echo "publish attempt $attempt failed; retrying"
            sleep 20
          done
          exit 1
