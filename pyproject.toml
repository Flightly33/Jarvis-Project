[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "J.A.R.V.I.S. - a voice-driven personal AI assistant that operates your computer under explicit safety controls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "psutil>=5.9",
    "send2trash>=1.8",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# Reasoning through your Claude subscription (Claude Code's programmatic mode).
claude = ["claude-agent-sdk>=0.2.100"]
# Local, offline speech: wake word, voice activity, speech-to-text, text-to-speech.
# piper-tts is GPL-3.0 licensed; it is optional and only imported when used.
voice = [
    "sherpa-onnx>=1.12",
    "sentencepiece>=0.2",
    "numpy>=1.26",
    "piper-tts>=1.3",
]
# Optional direct audio device access (needs the system package libportaudio2).
audio = ["sounddevice>=0.4"]
# Keyless web search for the OpenAI-compatible backend.
search = ["ddgs>=9.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: uses real external services or downloaded models (opt-in via environment variables)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = [
    "S101",   # asserts are fine in tests and for internal invariants
    "S603",   # subprocess use is the point of several tools; inputs are policy-checked
    "S607",   # desktop helpers are resolved through PATH by design
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "ASYNC"]
